# =============================================================
# Plant Disease Detection — Full Stack docker-compose
# =============================================================
# One command to rule them all:
#   docker compose up --build
#
# Services:
#   frontend  → http://localhost        (Flutter web via Nginx)
#   backend   → http://localhost:8000   (FastAPI)
#   mongodb   → localhost:27017
#   redis     → localhost:6379
# =============================================================



services:

  # -----------------------------------------------------------
  # MongoDB — primary database
  # -----------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: plant_disease_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: crop_disease_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - plant_disease_network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # -----------------------------------------------------------
  # Redis — caching / sessions
  # -----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: plant_disease_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - plant_disease_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------
  # FastAPI Backend
  # -----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plant_disease_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override with docker-compose service hostnames
      - MONGODB_URL=mongodb://admin:admin123@mongodb:27017/crop_disease_db?authSource=admin
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/models:/app/models
      - ./backend/logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - plant_disease_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # -----------------------------------------------------------
  # Flutter Web Frontend (served via Nginx)
  # Also reverse-proxies /api/* → backend:8000
  # -----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: plant_disease_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - plant_disease_network

# ---------------------------------------------------------------
# Named volumes (persist data between restarts)
# ---------------------------------------------------------------
volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local

# ---------------------------------------------------------------
# Isolated network — services talk to each other by name
# ---------------------------------------------------------------
networks:
  plant_disease_network:
    driver: bridge
