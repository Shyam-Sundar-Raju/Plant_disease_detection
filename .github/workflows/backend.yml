name: Backend CI

on:
  push:
    branches: [ main, setup-cicd ]
    paths:
      - 'backend/**'
      - 'k8s/**'
      - 'terraform/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [ main, setup-cicd ]
    paths:
      - 'backend/**'

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install flake8
        run: pip install flake8
      - name: Lint
        run: flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  unit-tests:
    name: Backend Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: backend
    env:
      MONGODB_URL: mongodb://localhost:27017
      SECRET_KEY: test_secret_key_123_test_secret_key_123
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libglib2.0-0
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Unit Tests
        run: python run_tests.py --unit

  integration-tests:
    name: Integration Tests (with MongoDB)
    needs: unit-tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: backend
    env:
      MONGODB_URL: mongodb://localhost:27017
      MONGODB_DB_NAME: plant_disease_test
      SECRET_KEY: test_secret_key_123_test_secret_key_123
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libglib2.0-0
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Integration Tests
        run: python run_tests.py --integration

  security-scan:
    name: Build & Security Check
    needs: integration-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'backend'
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  validate-k8s:
    name: Validate Kubernetes Manifests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'
      - name: Validate K8s Manifests (dry-run)
        run: |
          echo "Validating Kubernetes manifests..."
          kubectl apply --dry-run=client -f k8s/ --validate=false
          echo "✅ All Kubernetes manifests are valid"

  validate-terraform:
    name: Validate Terraform IaC
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: terraform
      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform
      - name: Terraform Format Check
        run: terraform fmt -check
        working-directory: terraform

  deploy-staging:
    name: Deploy to Staging
    needs: [security-scan, validate-k8s, validate-terraform]
    runs-on: ubuntu-latest
    steps:
      - name: Simulate Deployment
        run: |
          echo "Syncing Docker images to Staging Registry..."
          echo "Updating Kubernetes manifests..."
          echo "Deployment to Staging successful! ✅"

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Simulate Production Deployment
        run: |
          echo "Promoting staging image to production..."
          echo "Applying Blue-Green deployment strategy..."
          echo "Deployment to Production successful! 🚀"
