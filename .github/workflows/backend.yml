name: Backend CI

on:
  push:
    branches: [ main, setup-cicd ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ main, setup-cicd ]
    paths:
      - 'backend/**'

jobs:
  unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Unit Tests
        run: python run_tests.py --unit
        continue-on-error: true

  integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: backend
    env:
      MONGODB_URL: mongodb://localhost:27017
      MONGODB_DB_NAME: plant_disease_test
      SECRET_KEY: test_secret_key_123_test_secret_key_123
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Integration Tests
        run: python run_tests.py --integration
        continue-on-error: true

  lint:
    name: Backend Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install flake8
        run: pip install flake8
      - name: Lint
        run: flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
