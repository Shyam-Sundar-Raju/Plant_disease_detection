name: Backend CI

on:
  push:
    branches: [ main, setup-cicd ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ main, setup-cicd ]
    paths:
      - 'backend/**'

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install flake8
        run: pip install flake8
      - name: Lint
        run: flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  unit-tests:
    name: Backend Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Unit Tests
        run: python run_tests.py --unit
        continue-on-error: true

  integration-tests:
    name: Integration Tests (with MongoDB)
    needs: unit-tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: backend
    env:
      MONGODB_URL: mongodb://localhost:27017
      MONGODB_DB_NAME: plant_disease_test
      SECRET_KEY: test_secret_key_123_test_secret_key_123
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Integration Tests
        run: python run_tests.py --integration
        continue-on-error: true

  security-scan:
    name: Build & Security Check
    needs: integration-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'backend'
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

