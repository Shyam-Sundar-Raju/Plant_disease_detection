name: Frontend CI

on:
  push:
    branches: [ main, setup-cicd ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ main, setup-cicd ]
    paths:
      - 'frontend/**'

jobs:
  analyze:
    name: Frontend Static Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true
      - name: Analyze project source
        run: flutter analyze
        continue-on-error: true

  unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run tests
        run: flutter test
        continue-on-error: true

  build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    needs: [analyze, unit-tests]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build Web
        run: flutter build web
        continue-on-error: true
