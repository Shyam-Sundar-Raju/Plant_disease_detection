apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: plant-disease
  labels:
    app: plant-disease-backend
spec:
  type: ClusterIP   # Internal service; exposed externally via Ingress
  selector:
    app: plant-disease-backend
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP

---
# Ingress — routes external HTTPS traffic to the backend service
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  namespace: plant-disease
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"   # Auto-TLS via Let's Encrypt
    nginx.ingress.kubernetes.io/rate-limit: "100"         # 100 req/s rate limit
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"   # Allow image uploads up to 50MB
spec:
  tls:
    - hosts:
        - api.plant-disease.app
      secretName: plant-disease-tls
  rules:
    - host: api.plant-disease.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 80
