[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:mongodb]
command=mongod --bind_ip_all --port 27017 --dbpath /data/db --quiet
autostart=true
autorestart=true

[program:redis]
command=redis-server --port 6379
autostart=true
autorestart=true

[program:backend]
command=python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/app/backend
autostart=true
autorestart=true

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
